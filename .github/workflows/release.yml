name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build ready-to-print files
        run: |
          npm run build:starter
          (cd dist && zip -r ../aess-starter-set-${GITHUB_REF_NAME}.zip starter-set)
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            aess-starter-set-${{ github.ref_name }}.zip
            dist/starter-set/AESS-plate.3mf
            cad/aess_master.sc
