name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, geometry tests, browser smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Install Chromium for the smoke test
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Build the starter set
        run: npm run build:starter
      - uses: actions/upload-artifact@v7
        with:
          name: starter-set
          path: dist/starter-set
          retention-days: 14
